[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoseg"
version = "1.0.0"
description = "Helpers and tutorial for geospatial semantic segmentation with MMSegmentation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["mmengine>=0.10.3,<1.0", "mmsegmentation>=1.2.2,<1.3", "numpy", "tqdm"]

[project.optional-dependencies]
geo = ["rasterio>=1.3.9", "geopandas>=0.14", "shapely>=2.0", "pyproj>=3.6", "pyogrio>=0.7"]
dev = ["pytest>=7", "flake8>=6", "reportlab>=4"]

[tool.setuptools.packages.find]
include = ["geoseg", "geoseg.*"]
