[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umv"
version = "1.1.0"
description = "U-MV: U-shaped MambaVision segmentation for Acacia tortilis crown mapping from UAV imagery (MMSegmentation extension)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [{name = "Mohamed Barakat A. Gibril"}]
# Runtime dependencies are intentionally minimal: torch, mmcv and mamba-ssm must be
# installed for the target CUDA toolkit first (see docs/01_installation.md).
dependencies = [
    "mmengine>=0.10.3,<1.0",
    "mmsegmentation>=1.2.2,<1.3",
    "transformers>=4.40,<4.51",
    "timm>=1.0",
    "einops",
    "huggingface-hub",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3.9", "geopandas>=0.14", "shapely>=2.0", "pyproj>=3.6", "pyogrio>=0.7"]
dev = ["pytest>=7", "flake8>=6"]

[tool.setuptools.packages.find]
include = ["umv", "umv.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning", "ignore::DeprecationWarning"]
